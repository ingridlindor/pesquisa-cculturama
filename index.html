<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>

<body>

    <header>
        <h1>Pesquisa Culturama</h1>
        <p>Encontre eventos e atividades culturais na sua região.</p>
    </header>

    <main>
        <section class="dados-pessoais"> 
            <form action =  "" method ="get">
                <fieldset>
                    <legend>Dados Pessoais</legend>

                    
                    <label for="userName">Nome:</label>
                    <input type="text" id="userName" name="userName" required>

                    <label for ="age"> Idade: </label>
                    <input type="number" id="age" name="age" min="0" required>

                    <label for ="birthDate"> Data de Nascimento: </label> 
                    <input type="date" id="birthDate" name="birthDate" >

                    <label for ="userEmail"> E-mail: </label>
                    <input type="email" id="userEmail" name="userEmail" required>

                    <label for ="userPhone"> Telefone: </label>
                    <input type="tel" id="userPhone" name="userPhone" required> 

                    <label for ="userImage"> Foto de Perfil: </label>
                    <input type="file" id="userImage" name="userImage" >


                    
                </fieldset>

                <fieldset>
                    <legend>Perfil</legend>


                    <p>Gênero:</p>
                    <input type ="radio" name="userGender" value ="Feminino">
                    <label for="userGender" value="Feminino">Feminino</label>
                    <input type ="radio" name="userGender" value="Masculino">
                    <label for="userGender" value="Masculino">Masculino</label>
                    <input type ="radio" name="userGender" value="Prefiro não informar">
                    <label for="userGender" value="Prefiro não informar">Prefiro não informar</label>
                    <br>

                    <label for="maritalStatus">Estado Civil:</label>
                    <select name ="maritalStatus" id="maritalStatus">
                        <option value="">Selecione...</option>
                        <option value="solteiro">Solteiro(a)</option>
                        <option value="casado">Casado(a)</option>
                        <option value="divorciado">Divorciado(a)</option>
                        <option value="viuvo">Viúvo(a)</option>
                    </select>

                    <br>
                  <label for="userState">Estado: </label>
                    <select name="userState" id="userState">
                        <option value="Acre">Acre</option>
                        <option value="Alagoas">Alagoas</option>
                        <option value="Amapá">Amapá</option>
                        <option value="Amazonas">Amazonas</option>
                        <option value="Bahia">Bahia</option>
                        <option value="Ceará">Ceará</option>
                        <option value="Distrito Federal">Distrito Federal</option>
                        <option value="Espirito Santo">Espirito Santo</option>
                        <option value="Goiás">Goiás</option>
                        <option value="Maranhão">Maranhão</option>
                        <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                        <option value="Mato Grosso">Mato Grosso</option>
                        <option value="Minas Gerais">Minas Gerais</option>
                        <option value="Pará">Pará</option>
                        <option value="Paraíba">Paraíba</option>
                        <option value="Paraná">Paraná</option>
                        <option value="Pernambuco">Pernambuco</option>
                        <option value="Piauí">Piauí</option>
                        <option value="Rio de Janeiro">Rio de Janeiro</option>
                        <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                        <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                        <option value="Rondônia">Rondônia</option>
                        <option value="Roraima">Roraima</option>
                        <option value="Santa Catarina">Santa Catarina</option>
                        <option value="São Paulo">São Paulo</option>
                        <option value="Sergipe">Sergipe</option>
                        <option value="Tocantins">Tocantins</option>    
                    </select>  
                  
                  <label for="userCity"> Cidade: </label>
                  <input type="text" id="userCity" name="userCity" required>
               
                </fieldset>

                <button type="submit">Enviar</button>

            </form>
        </section>
    </main>
    
</body>
</html>
